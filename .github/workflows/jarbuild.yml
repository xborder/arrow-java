name: JarBuild
on:
  workflow_dispatch:
    inputs:
      arrow_branch:
        description: 'Arrow branch to build'
        required: true
        default: main
      arrow_repo:
        description: 'Arrow repository'
        type: string
        required: true
        default: apache/arrow
      release_tag_name:
        description: 'release tag name'
        type: string
        required: true

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trim workflow inputs
        run: |
          echo "ARROW_BRANCH=$(echo '${{github.event.inputs.arrow_branch}}' | xargs)" >> $GITHUB_ENV
          echo "ARROW_REPO=$(echo '${{github.event.inputs.arrow_repo}}' | xargs)" >> $GITHUB_ENV
          echo "RELEASE_TAG_NAME=$(echo '${{github.event.inputs.release_tag_name}}' | xargs)" >> $GITHUB_ENV
      - name: Print workflow input parameters
        run: |
          echo "=========================================="
          echo "Workflow Input Parameters"
          echo "=========================================="
          echo "arrow_branch: ${{env.ARROW_BRANCH}}"
          echo "arrow_repo: ${{env.ARROW_REPO}}"
          echo "release_tag_name: ${{env.RELEASE_TAG_NAME}}"
          echo "arrow-java branch: ${{github.ref_name}}"
          echo ""
          echo "Direct Links:"
          echo "----------------------------------------"
          echo "Arrow C++ repo/branch: https://github.com/${{env.ARROW_REPO}}/tree/${{env.ARROW_BRANCH}}"
          echo "Arrow Java repo/branch: https://github.com/${{github.repository}}/tree/${{github.ref_name}}"
          echo "Release tag: https://github.com/${{github.repository}}/releases/tag/${{env.RELEASE_TAG_NAME}}"
          echo "=========================================="
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Prepare for tag
        run: |
          echo "${{env.RELEASE_TAG_NAME}}"
          ver=$(echo ${{env.RELEASE_TAG_NAME}})
          version=${ver%-rc*}
          version=${version#v}
          rc=${ver#*-rc}
          echo "VERSION=${version}" >> ${GITHUB_ENV}
          echo "VERSION=${version}"
          echo "RC=${rc}" >> ${GITHUB_ENV}
          echo "RC=${rc}"
      - name: Archive
        run: |
          id="apache-arrow-java-${VERSION}"
          tar_gz="${id}.tar.gz"
          echo "TAR_GZ=${tar_gz}" >> ${GITHUB_ENV}
          git archive HEAD --prefix "${id}/" --output "${tar_gz}"
          sha256sum "${tar_gz}" > "${tar_gz}.sha256"
          sha512sum "${tar_gz}" > "${tar_gz}.sha512"
      - name: Audit
        run: |
          dev/release/run_rat.sh "${TAR_GZ}"
      - name: Upload source archive
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-source
          path: |
            apache-arrow-java-*
  jni-linux:
    name: JNI ${{ matrix.platform.runs_on }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 240
    needs:
      - source
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs_on: ubuntu-latest
            arch: "x86_64"
            archery_arch: "amd64"
          - runs_on: ubuntu-24.04-arm
            arch: "aarch_64"
            archery_arch: "arm64v8"
    env:
      # architecture name used for archery build
      ARCH: ${{ matrix.platform.archery_arch }}
      DOCKER_VOLUME_PREFIX: .docker/
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-source
      - name: Extract source archive
        run: |
          tar -xf apache-arrow-java-*.tar.gz --strip-components=1
      # - name: Download the latest Apache Arrow C++
      #   if: github.event_name != 'schedule'
      #   run: |
      #     ci/scripts/download_cpp.sh
      - name: Checkout Apache Arrow C++
        # if: github.event_name == 'schedule'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{github.event.inputs.arrow_repo}}
          ref: ${{github.event.inputs.arrow_branch}}
          path: arrow
      - name: Checkout apache/arrow-testing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: apache/arrow-testing
          path: arrow/testing
      - name: Checkout apache/parquet-testing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: apache/parquet-testing
          path: arrow/cpp/submodules/parquet-testing
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .docker
          key: jni-linux-${{ matrix.platform.arch }}-${{ hashFiles('arrow/cpp/**') }}
          restore-keys: jni-linux-${{ matrix.platform.arch }}-
      - name: Build
        run: |
          docker compose run vcpkg-jni
      - name: Push Docker image
        if: success() && github.event_name == 'push' && github.repository == 'apache/arrow-java' && github.ref_name == 'main'
        run: |
          docker compose push vcpkg-jni
      - name: Compress into single artifact to keep directory structure
        run: tar -cvzf jni-linux-${{ matrix.platform.arch }}.tar.gz jni/
      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: jni-linux-${{ matrix.platform.arch }}
          path: jni-linux-${{ matrix.platform.arch }}.tar.gz
  jni-macos:
    name: JNI ${{ matrix.platform.runs_on }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 445
    needs:
      - source
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runs_on: macos-15, arch: "aarch_64" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Download source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-source
      - name: Extract source archive
        run: |
          tar -xf apache-arrow-java-*.tar.gz --strip-components=1
      # - name: Download the latest Apache Arrow C++
      #   if: github.event_name != 'schedule'
      #   run: |
      #     ci/scripts/download_cpp.sh
      - name: Checkout Apache Arrow C++
        # if: github.event_name == 'schedule'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{github.event.inputs.arrow_repo}}
          ref: ${{github.event.inputs.arrow_branch}}
          path: arrow
      - name: Checkout apache/arrow-testing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: apache/arrow-testing
          path: arrow/testing
      - name: Checkout apache/parquet-testing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: apache/parquet-testing
          path: arrow/cpp/submodules/parquet-testing
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          cache: 'pip'
          python-version: 3.12
      - name: Install Archery
        run: pip install -e arrow/dev/archery[all]
      - name: Checkout vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Microsoft/vcpkg
          path: arrow/vcpkg
          fetch-depth: 0
      - name: Install vcpkg
        run: |
          cd arrow/vcpkg
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT_LOCAL=${PWD}" >> ${GITHUB_ENV}
          echo "${PWD}" >> ${GITHUB_PATH}
      - name: Clean up disk space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h /

          echo ""
          echo "=== Removing Xcode simulators ==="
          sudo rm -rf /Library/Developer/CoreSimulator/Caches || :
          echo "Removed /Library/Developer/CoreSimulator/Caches"

          echo ""
          echo "=== Removing user simulator data ==="
          rm -rf ~/Library/Developer/CoreSimulator || :
          echo "Removed ~/Library/Developer/CoreSimulator"

          echo ""
          echo "=== Free disk space after cleanup ==="
          df -h /
      - name: Install dependencies
        run: |
          echo "=== Free disk space at start of dependency installation ==="
          df -h /

          echo ""
          # Ensure updating python@XXX with the "--overwrite" option.
          # If python@XXX is updated without "--overwrite", it causes
          # a conflict error. Because Python 3 installed not by
          # Homebrew exists in /usr/local on GitHub Actions. If
          # Homebrew's python@XXX is updated without "--overwrite", it
          # tries to replace /usr/local/bin/2to3 and so on and causes
          # a conflict error.
          brew update
          for python_package in $(brew list | grep python@); do
            brew install --overwrite ${python_package}
          done
          brew install --overwrite python

          if [ "$(uname -m)" = "arm64" ]; then
            # pkg-config formula is deprecated but it's still installed
            # in GitHub Actions runner now. We can remove this once
            # pkg-config formula is removed from GitHub Actions runner.
            brew uninstall pkg-config || :
            brew uninstall pkg-config@0.29.2 || :
          fi

          # Install basic build tools via brew (vcpkg needs these)
          brew install cmake ninja pkg-config
          brew bundle --file=arrow/cpp/Brewfile

          # Clean up any existing LLVM installations in favor of vcpkg.
          # Need to uninstall all versioned LLVM packages (llvm@18, llvm@17, etc.)
          for llvm_pkg in $(brew list | grep -E '^llvm(@[0-9]+)?$'); do
            brew uninstall "${llvm_pkg}" || :
          done

          # We want to link aws-sdk-cpp statically but Homebrew's
          # aws-sdk-cpp provides only shared library. If we have
          # Homebrew's aws-sdk-cpp, our build mix Homebrew's
          # aws-sdk-cpp and bundled aws-sdk-cpp. We uninstall Homebrew's
          # aws-sdk-cpp to ensure using only bundled aws-sdk-cpp.
          brew uninstall aws-sdk-cpp || :
          # We want to use bundled RE2 for static linking. If
          # Homebrew's RE2 is installed, its header file may be used.
          # We uninstall Homebrew's RE2 to ensure using bundled RE2.
          brew uninstall grpc || : # gRPC depends on RE2
          brew uninstall grpc@1.54 || : # gRPC 1.54 may be installed too
          brew uninstall re2 || :
          # We want to use bundled Protobuf for static linking. If
          # Homebrew's Protobuf is installed, its library file may be
          # used on test  We uninstall Homebrew's Protobuf to ensure using
          # bundled Protobuf.
          brew uninstall protobuf || :

          echo ""
          echo "=== Free disk space before LLVM build ==="
          df -h /

          echo ""
          # Use vcpkg to install LLVM.
          vcpkg install \
            --clean-after-build \
            --vcpkg-root=${VCPKG_ROOT_LOCAL} \
            --x-install-root=${VCPKG_ROOT_LOCAL}/installed \
            --x-manifest-root=arrow/ci/vcpkg \
            --overlay-ports=arrow/ci/vcpkg/overlay/llvm/ \
            --x-feature=gandiva-llvm

          echo ""
          echo "=== Free disk space after LLVM build ==="
          df -h /

          echo ""
          brew bundle --file=Brewfile
      - name: Prepare ccache
        run: |
          echo "CCACHE_DIR=${PWD}/ccache" >> ${GITHUB_ENV}
      - name: Cache ccache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ccache
          key: jni-macos-${{ matrix.platform.arch }}-${{ hashFiles('arrow/cpp/**') }}
          restore-keys: jni-macos-${{ matrix.platform.arch }}-
      - name: Build
        run: |
          echo "=== Free disk space at start of build ==="
          df -h /

          echo ""
          set -e
          # make brew Java available to CMake
          export JAVA_HOME=$(brew --prefix openjdk@11)/libexec/openjdk.jdk/Contents/Home
          ci/scripts/jni_macos_build.sh . arrow build jni

          echo ""
          echo "=== Free disk space at end of build ==="
          df -h /
      - name: Compress into single artifact to keep directory structure
        run: tar -cvzf jni-macos-${{ matrix.platform.arch }}.tar.gz jni/
      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: jni-macos-${{ matrix.platform.arch }}
          path: jni-macos-${{ matrix.platform.arch }}.tar.gz
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    needs:
      - jni-linux
      - jni-macos
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Decompress artifacts
        run: |
          mv artifacts/*/*.tar.gz .
          tar -xf apache-arrow-java-*.tar.gz --strip-components=1
          tar -xvzf jni-linux-x86_64.tar.gz
          tar -xvzf jni-linux-aarch_64.tar.gz
          tar -xvzf jni-macos-aarch_64.tar.gz
      - name: Test that shared libraries exist
        run: |
          set -x

          test -f jni/arrow_cdata_jni/x86_64/libarrow_cdata_jni.so
          test -f jni/arrow_dataset_jni/x86_64/libarrow_dataset_jni.so
          test -f jni/arrow_orc_jni/x86_64/libarrow_orc_jni.so
          test -f jni/gandiva_jni/x86_64/libgandiva_jni.so

          test -f jni/arrow_cdata_jni/aarch_64/libarrow_cdata_jni.so
          test -f jni/arrow_dataset_jni/aarch_64/libarrow_dataset_jni.so
          test -f jni/arrow_orc_jni/aarch_64/libarrow_orc_jni.so
          test -f jni/gandiva_jni/aarch_64/libgandiva_jni.so

          test -f jni/arrow_cdata_jni/aarch_64/libarrow_cdata_jni.dylib
          test -f jni/arrow_dataset_jni/aarch_64/libarrow_dataset_jni.dylib
          test -f jni/arrow_orc_jni/aarch_64/libarrow_orc_jni.dylib
          test -f jni/gandiva_jni/aarch_64/libgandiva_jni.dylib

      - name: Checkout apache/arrow-testing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: apache/arrow-testing
          path: testing
      - name: Cache ~/.m2
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.m2
          key: binaries-build-${{ hashFiles('**/*.java', '**/pom.xml') }}
          restore-keys: binaries-build-
      - name: Set up Maven 3.9.16
        run: |
          archive="${RUNNER_TEMP}/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            --output "${archive}"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  ${archive}" | shasum -a 512 -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-3.9.16/bin" >> "${GITHUB_PATH}"
      - name: Build bundled JAR and docs
        run: |
          java -version
          mvn -version
          ci/scripts/jni_full_build.sh . jni binaries
      - name: Prepare docs
        run: |
          mkdir -p docs
          cp -a target/site/apidocs reference
          tar -cvzf reference.tar.gz reference
      - name: Upload binaries
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-binaries
          path: binaries/*
      - name: Upload docs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: reference
          path: reference.tar.gz
  docs:
    name: Docs
    needs:
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          cache: 'pip'
      - name: Download source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-source
      - name: Download Javadocs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: reference
      - name: Extract source archive
        run: |
          tar -xf apache-arrow-java-*.tar.gz --strip-components=1
      - name: Build
        run: |
          cd docs
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          make html
          tar -xf ../reference.tar.gz -C build/html
      - name: Compress into single artifact to keep directory structure
        run: tar -cvzf html.tar.gz -C docs/build html
      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-html
          path: html.tar.gz
  verify:
    name: Verify
    needs:
      - binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
      - name: Set up Maven 3.9.16
        run: |
          archive="${RUNNER_TEMP}/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            --output "${archive}"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  ${archive}" | shasum -a 512 -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-3.9.16/bin" >> "${GITHUB_PATH}"
      - name: Verify
        run: |
          java -version
          mvn -version
          mv release-source/* ./
          tar_gz=$(echo apache-arrow-java-*.tar.gz)
          version=${tar_gz#apache-arrow-java-}
          version=${version%.tar.gz}
          # rc isn't used with VERIFY_DOWNLOAD=0
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            rc="${GITHUB_REF_NAME#*-rc}"
          else
            rc=$(date +%Y%m%d)
          fi
          tar -xf ${tar_gz}
          export VERIFY_DEFAULT=0
          export VERIFY_BINARY=1
          export VERIFY_SOURCE=1
          cd apache-arrow-java-${version}
          mv ../${tar_gz}* ./
          mv ../release-binaries binaries
          dev/release/verify_rc.sh "${version}" "${rc}"
  upload:
    name: Upload
    needs:
      - docs
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout arrow-java repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout Apache Arrow C++ repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{github.event.inputs.arrow_repo}}
          ref: ${{github.event.inputs.arrow_branch}}
          path: arrow
      - name: Get commit IDs
        id: commit_ids
        run: |
          # Get short commit ID for arrow-java
          arrow_java_commit=$(git rev-parse --short HEAD)
          echo "arrow_java_commit=${arrow_java_commit}" >> $GITHUB_OUTPUT

          # Get short commit ID for arrow
          cd arrow
          arrow_commit=$(git rev-parse --short HEAD)
          echo "arrow_commit=${arrow_commit}" >> $GITHUB_OUTPUT
          cd ..

          # Parse version from release tag
          ver=$(echo ${{github.event.inputs.release_tag_name}})
          version=${ver%-rc*}
          version=${version#v}
          rc=${ver#*-rc}

          # Create release name with both commit IDs
          release_name="${version}-${arrow_java_commit}-${arrow_commit}"
          release_tag="v${release_name}"
          echo "release_name=${release_name}" >> $GITHUB_OUTPUT
          echo "release_tag=${release_tag}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "rc=${rc}" >> $GITHUB_OUTPUT

          echo "Arrow Java commit: ${arrow_java_commit}"
          echo "Arrow commit: ${arrow_commit}"
          echo "Release tag: ${release_tag}"
      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: artifacts
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.commit_ids.outputs.release_tag }}" -m "Release ${{ steps.commit_ids.outputs.release_name }} RC${{ steps.commit_ids.outputs.rc }}" -m "Action URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "${{ steps.commit_ids.outputs.release_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload
        run: |
          # GH-499: How to create release notes?
          echo "Creating release: ${{ steps.commit_ids.outputs.release_tag }}"
          gh release create "${{ steps.commit_ids.outputs.release_tag }}" \
            -n "Release ${{ steps.commit_ids.outputs.release_name }} RC${{ steps.commit_ids.outputs.rc }}<br>Triggered by: ${{ github.actor }}<br>Action URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID<br>arrow_branch: ${{github.event.inputs.ARROW_BRANCH}}<br>arrow_repo: ${{github.event.inputs.ARROW_REPO}}<br>arrow-java branch: ${{github.ref_name}}<br>release_tag_name: ${{ steps.commit_ids.outputs.release_tag }}" \
            --prerelease \
            --repo ${GITHUB_REPOSITORY} \
            --title "Apache Arrow Java ${{ steps.commit_ids.outputs.version }} RC${{ steps.commit_ids.outputs.rc }} (arrow-java: ${{ steps.commit_ids.outputs.arrow_java_commit }}, arrow: ${{ steps.commit_ids.outputs.arrow_commit }})"
          # GitHub CLI does not respect their own rate limits
          # https://github.com/cli/cli/issues/9586
          for artifact in artifacts/*/*; do
            sleep 1
            gh release upload "${{ steps.commit_ids.outputs.release_tag }}" \
              --repo ${GITHUB_REPOSITORY} \
              $artifact
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
